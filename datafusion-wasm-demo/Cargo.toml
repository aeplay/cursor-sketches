[package]
name = "datafusion-wasm-demo"
version = "0.1.0"
edition = "2021"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib"]

[dependencies]
datafusion-sql = "44"
datafusion-common = "44"
datafusion-expr = "44"
wasm-bindgen = "0.2.95"
arrow-schema = "53"
getrandom = { version = "0.3", features = ["wasm_js"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
